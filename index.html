<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />

  <title>Awesome Open Assets · 全球开源素材资源导航</title>
  <meta name="description" content="精选 1100+ 全球开源 / CC 授权素材资源：图片、视频、音频、字体、3D、动效、配色与模板，逐条标注许可与商用可行性。" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

<body>
  <!-- 顶部导航（白底 90% + 轻模糊 + 1px 底边，sofindai 同款） -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="#top" aria-label="Awesome Open Assets">
        <img src="assets/logo.svg" alt="" class="brand-logo" width="33" height="33" />
        <span class="brand-name">Awesome<span class="brand-accent">OpenAssets</span></span>
      </a>
      <nav class="nav-actions">
        <div class="seg" id="langSwitch" role="group" aria-label="Language">
          <button data-lang="zh" class="seg-btn is-active">中文</button>
          <button data-lang="en" class="seg-btn">EN</button>
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="切换明暗主题">
          <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>

          <svg class="ic ic-sm" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          <span class="gh-text">@guolios</span>
        </a>
      </nav>
    </div>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <div class="hero-inner">
        <h1 class="hero-title" id="heroTitle">全球开源素材资源导航</h1>
        <p class="hero-sub" id="heroSub">精选 1100+ 个全球开源 / CC 授权素材：图片、视频、音频、字体、3D、动效、配色与模板，逐条标注许可与商用可行性。</p>
        <div class="hero-stats" id="heroStats"></div>
        <div class="hero-cta">
          <a class="primary-btn" id="ctaRepo" href="https://github.com/guolios/awesome-open-assets" target="_blank" rel="noopener">

            <span id="ctaRepoText">在 GitHub 查看仓库</span>
          </a>
          <a class="secondary-btn" id="ctaDocs" href="https://github.com/guolios/awesome-open-assets#readme" target="_blank" rel="noopener">
            <span id="ctaDocsText">阅读说明文档</span>
            <svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </section>

    <!-- 工具栏 -->
    <section class="toolbar" id="toolbar">
      <div class="toolbar-inner">
        <div class="search-wrap">
          <span class="search-icon">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          </span>
          <input type="search" id="search" class="search-input" placeholder="搜索名称、特色、许可……" autocomplete="off" />
        </div>
        <div class="filter-row">
          <div class="chips" id="catChips" aria-label="按分类筛选"></div>
        </div>
        <div class="filter-row">
          <div class="chips license-chips" id="licenseChips" aria-label="按许可筛选"></div>
          <span class="result-count" id="resultCount"></span>
        </div>
      </div>
    </section>

    <!-- 结果 -->
    <section class="results" id="results" aria-live="polite"></section>

    <p class="empty" id="emptyState" hidden>没有匹配的资源，换个关键词试试。</p>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <strong id="footTitle">Awesome Open Assets</strong>
        <p class="foot-note" id="footNote">一个持续维护的开源素材收藏清单。所有条目均经人工核实许可与存活性，正式取用前请再次确认。</p>
      </div>

          GitHub
        </a>
        <a href="https://github.com/guolios/awesome-open-assets#readme" target="_blank" rel="noopener">
          <svg class="ic ic-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h11l3 3v13.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 19.5Z"/><path d="M8 8h7M8 12h7M8 16h4"/></svg>
